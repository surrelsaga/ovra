appId: com.ovra.app
productName: Ovra
directories:
  buildResources: build
# ponytail: allowlist; production node_modules are added by electron-builder itself
files:
  - out/**
  - resources/**
  - package.json
asarUnpack:
  - resources/**
  - node_modules/@smartspectra/node-sdk-darwin-arm64/**
  - node_modules/@smartspectra/node-sdk-win32-x64/**
win:
  executableName: ovra
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  signExecutable: false
  files:
    - out/**
    - resources/**
    - package.json
    - '!node_modules/@smartspectra/node-sdk-darwin-arm64/**'
    - '!node_modules/@smartspectra/node-sdk-linux-*/**'
nsis:
  artifactName: ${productName}-Setup-${version}.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  target:
    - target: dmg
      arch:
        - arm64
  icon: build/icon.icns
  hardenedRuntime: true
  identity: '-'
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSCameraUsageDescription: Ovra uses the camera during sessions you start to offer wellness check-ins. Video is not saved.
    NSAppleEventsUsageDescription: Ovra uses Apple Events only to control Spotify music during sessions you start.
  notarize: false
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
